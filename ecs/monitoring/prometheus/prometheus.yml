global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cloudwatch-exporter
    static_configs:
      - targets: ["localhost:9106"]

  - job_name: backend
    static_configs:
      - targets: ["backend.testcluster.local:5000"]

  - job_name: nginx-exporter
    static_configs:
      - targets: ["frontend.testcluster.local:9113"]
